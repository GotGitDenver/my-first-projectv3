<!DOCTYPE html>
<html>
<head>
  <title>MLB Scores Today mm</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1 { margin-bottom: 10px; }
    .game {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
      cursor: pointer;
      background: white;
    }
    .game:hover { background: #f4f4f4; }
    .score { font-size: 22px; font-weight: bold; }
    .status { color: #555; margin-top: 5px; }
    #boxscore { margin-top: 30px; }
    table { border-collapse: collapse; margin-top: 10px; width: 100%; max-width: 800px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #eee; }
  </style>
</head>

<body>
  <h1>MLB Scores Today nn</h1>
  <p>Click a game to see the box score.</p>

  <div id="games">Loading games...</div>
  <div id="boxscore"></div>

  <script>
    async function loadGames() {
      const gamesDiv = document.getElementById("games");
      gamesDiv.innerHTML = "Loading games...";

      const today = new Date().toISOString().slice(0, 10);

      const url =
        "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=" +
        today +
        "&hydrate=linescore";

      const response = await fetch(url);
      const data = await response.json();

      gamesDiv.innerHTML = "";

      if (!data.dates || data.dates.length === 0) {
        gamesDiv.innerHTML = "No MLB games found today.";
        return;
      }

      const games = data.dates[0].games;

      games.forEach(game => {
        const awayTeam = game.teams.away.team.name;
        const homeTeam = game.teams.home.team.name;

        const awayScore =
          game.linescore &&
          game.linescore.teams &&
          game.linescore.teams.away
            ? game.linescore.teams.away.runs
            : game.teams.away.score;

        const homeScore =
          game.linescore &&
          game.linescore.teams &&
          game.linescore.teams.home
            ? game.linescore.teams.home.runs
            : game.teams.home.score;

        const displayAwayScore =
          awayScore === undefined ? "-" : awayScore;

        const displayHomeScore =
          homeScore === undefined ? "-" : homeScore;

        const status = game.status.detailedState;

        const div = document.createElement("div");
        div.className = "game";

        div.innerHTML =
          "<div class='score'>" +
          awayTeam +
          " " +
          displayAwayScore +
          " @ " +
          homeTeam +
          " " +
          displayHomeScore +
          "</div>" +
          "<div class='status'>" +
          status +
          "</div>";

        div.onclick = function () {
          loadBoxScore(game.gamePk, awayTeam, homeTeam);
        };

        gamesDiv.appendChild(div);
      });
    }

    async function loadBoxScore(gamePk, awayTeam, homeTeam) {
      const boxDiv = document.getElementById("boxscore");
      boxDiv.innerHTML = "Loading box score...";

      const url =
        "https://statsapi.mlb.com/api/v1/game/" +
        gamePk +
        "/boxscore";

      const response = await fetch(url);
      const data = await response.json();

      boxDiv.innerHTML =
        "<h2>Box Score: " +
        awayTeam +
        " @ " +
        homeTeam +
        "</h2>" +
        "<h3>" +
        awayTeam +
        "</h3>" +
        makeBattingTable(data.teams.away.players) +
        "<h3>" +
        homeTeam +
        "</h3>" +
        makeBattingTable(data.teams.home.players);
    }

    function makeBattingTable(players) {
      let rows = "";

      Object.values(players).forEach(player => {
        if (!player.stats || !player.stats.batting) return;

        const batting = player.stats.batting;

        rows +=
          "<tr>" +
          "<td>" + player.person.fullName + "</td>" +
          "<td>" + (batting.atBats || 0) + "</td>" +
          "<td>" + (batting.runs || 0) + "</td>" +
          "<td>" + (batting.hits || 0) + "</td>" +
          "<td>" + (batting.rbi || 0) + "</td>" +
          "<td>" + (batting.homeRuns || 0) + "</td>" +
          "</tr>";
      });

      return (
        "<table>" +
        "<tr>" +
        "<th>Player</th>" +
        "<th>AB</th>" +
        "<th>R</th>" +
        "<th>H</th>" +
        "<th>RBI</th>" +
        "<th>HR</th>" +
        "</tr>" +
        rows +
        "</table>"
      );
    }

    loadGames();

    setInterval(loadGames, 30000);
  </script>
</body>
</html>
