<!DOCTYPE html>
<html>
<head>
  <title>MLB Scores YES!</title>
  <style>
    body { font-family: Arial; margin: 30px; }
    .game { border: 1px solid #ccc; padding: 12px; margin: 10px 0; cursor: pointer; }
    .game:hover { background: #f2f2f2; }
    #boxscore { margin-top: 25px; }
  </style>
</head>
<body>
  <h1>MLB Games Today</h1>
  <div id="games">Loading games...</div>
  <div id="boxscore"></div>

  <script>
    async function loadGames() {
      const today = new Date().toISOString().slice(0, 10);

      const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today}&hydrate=linescore`;

      const response = await fetch(url);
      const data = await response.json();

      const gamesDiv = document.getElementById("games");
      gamesDiv.innerHTML = "";

      const games = data.dates[0]?.games || [];

      if (games.length === 0) {
        gamesDiv.innerHTML = "No MLB games today.";
        return;
      }

      games.forEach(game => {
        const away = game.teams.away.team.name;
        const home = game.teams.home.team.name;

        const awayScore = game.teams.away.score ?? 0;
        const homeScore = game.teams.home.score ?? 0;

        const status = game.status.detailedState;

        const div = document.createElement("div");
        div.className = "game";
        div.innerHTML = `
          <strong>${away} ${awayScore} @ ${home} ${homeScore}</strong><br>
          Status: ${status}
        `;

        div.onclick = () => loadBoxScore(game.gamePk, away, home);
        gamesDiv.appendChild(div);
      });
    }

    async function loadBoxScore(gamePk, away, home) {
      const url = `https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`;

      const response = await fetch(url);
      const data = await response.json();

      const boxDiv = document.getElementById("boxscore");

      boxDiv.innerHTML = `
        <h2>Box Score: ${away} @ ${home}</h2>
        <h3>${away}</h3>
        ${makeBattingTable(data.teams.away.players)}

        <h3>${home}</h3>
        ${makeBattingTable(data.teams.home.players)}
      `;
    }

    function makeBattingTable(players) {
      let rows = "";

      Object.values(players).forEach(player => {
        const stats = player.stats?.batting;
        if (!stats) return;

        rows += `
          <tr>
            <td>${player.person.fullName}</td>
            <td>${stats.atBats ?? 0}</td>
            <td>${stats.runs ?? 0}</td>
            <td>${stats.hits ?? 0}</td>
            <td>${stats.rbi ?? 0}</td>
          </tr>
        `;
      });

      return `
        <table border="1" cellpadding="6">
          <tr>
            <th>Player</th>
            <th>AB</th>
            <th>R</th>
            <th>H</th>
            <th>RBI</th>
          </tr>
          ${rows}
        </table>
      `;
    }

    loadGames();
  </script>
</body>
</html>
